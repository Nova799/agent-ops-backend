<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>AgentOps Dashboard</title>
  <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(20, 28, 52, 0.72);
      --border: rgba(99, 102, 241, 0.25);
      --accent: #6366f1;
      --accent2: #22d3ee;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --card: rgba(15, 23, 42, 0.6);
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: 'Inter', system-ui, sans-serif; background: radial-gradient(1200px 600px at 20% -10%, #1e1b4b, transparent), var(--bg); color:var(--text); }
    header { padding:14px 22px; background:var(--panel); backdrop-filter: blur(12px); display:flex; gap:12px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--border); box-shadow: 0 4px 30px rgba(0,0,0,.3); }
    h2 { margin:0; background: linear-gradient(90deg,#818cf8,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:700; }
    input, select, button { padding:9px 14px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); transition: all .2s; }
    input:focus, select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(99,102,241,.2); }
    button { cursor:pointer; background:linear-gradient(135deg,#6366f1,#22d3ee); border:none; font-weight:600; }
    button.secondary { background:var(--card); border:1px solid var(--border); }
    button:hover { transform: translateY(-1px); box-shadow:0 6px 20px rgba(99,102,241,.35); }
    main { display:grid; grid-template-columns: 290px 1fr 360px; height: calc(100vh - 68px); gap: 0; }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; height: auto; min-height: calc(100vh - 68px); }
      aside, .side { max-height: 40vh; }
      #cy { min-height: 50vh; }
    }
    body.light { --bg:#f8fafc; --panel:rgba(255,255,255,.75); --border:rgba(99,102,241,.2); --text:#0f172a; --muted:#475569; --card:rgba(255,255,255,.85); }
    aside { border-right:1px solid var(--border); overflow:auto; padding:14px; background: rgba(15,23,42,.35); }
    .side { border-left:1px solid var(--border); overflow:auto; padding:16px; background: rgba(15,23,42,.35); display:flex; flex-direction:column; gap:14px; }
    #cy { width:100%; height:100%; background: transparent; }
    .trace { padding:12px; border:1px solid var(--border); border-radius:12px; margin-bottom:10px; cursor:pointer; background:var(--card); transition:all .2s; }
    .trace:hover { background: rgba(99,102,241,.12); transform: translateX(2px); }
    .trace.active { border-color:var(--accent); box-shadow:0 0 0 2px rgba(99,102,241,.3); }
    .step { border-left:3px solid var(--accent); padding:12px; margin:10px 0; background:var(--card); border-radius:10px; }
    .label { font-size:11px; text-transform:uppercase; color:var(--muted); margin:8px 0 3px; letter-spacing:.5px; }
    pre { white-space:pre-wrap; word-break:break-word; background:rgba(0,0,0,.35); padding:10px; border-radius:8px; font-size:12px; margin:4px 0; border:1px solid var(--border); }
    .md { background:rgba(0,0,0,.25); padding:10px 12px; border-radius:8px; font-size:13px; line-height:1.55; border:1px solid var(--border); }
    .md p { margin:6px 0; }
    .md ul, .md ol { margin:6px 0 6px 20px; padding:0; }
    .md code { background:rgba(99,102,241,.2); padding:1px 5px; border-radius:4px; font-size:12px; }
    .md pre { background:rgba(0,0,0,.45); padding:10px; border-radius:8px; overflow:auto; }
    .md pre code { background:transparent; padding:0; }
    .md h1,.md h2,.md h3 { margin:8px 0 4px; color:#c7d2fe; }
    .md blockquote { border-left:3px solid var(--accent); margin:6px 0; padding:4px 10px; color:var(--muted); }
    .md a { color:var(--accent2); }
    .filters { display:flex; gap:8px; align-items:center; }
    .chart-box { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; }
    .chart-box h4 { margin:0 0 8px; font-size:13px; color:var(--muted); font-weight:600; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .stat { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px; text-align:center; }
    .stat .v { font-size:20px; font-weight:700; background:linear-gradient(90deg,#818cf8,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .stat .k { font-size:10px; color:var(--muted); text-transform:uppercase; }
  </style>
</head>
<body>
  <header>
    <h2>AgentOps</h2>
    <input id="apiKey" placeholder="API Key (X-API-Key)" />
    <input id="baseUrl" placeholder="Base URL" />
    <div class="filters">
      <input id="search" placeholder="Filtrer sessions" oninput="renderList()" />
      <select id="statusFilter" onchange="renderList()">
        <option value="">Tous statuts</option>
        <option value="active">active</option>
        <option value="completed">completed</option>
        <option value="error">error</option>
      </select>
    </div>
    <button onclick="loadTraces()">Charger</button>
    <button class="secondary" onclick="exportJson()">Exporter JSON</button>
    <button class="secondary" onclick="toggleTheme()">Thème</button>
  </header>
  <main>
    <aside id="list"></aside>
    <div id="cy"></div>
    <div class="side">
      <div class="stats">
        <div class="stat"><div class="v" id="stTraces">0</div><div class="k">Traces</div></div>
        <div class="stat"><div class="v" id="stSteps">0</div><div class="k">Steps</div></div>
      </div>
      <div class="chart-box"><h4>Steps par trace</h4><canvas id="chartSteps" height="140"></canvas></div>
      <div class="chart-box"><h4>Statuts</h4><canvas id="chartStatus" height="140"></canvas></div>
      <div id="detail"><p>Sélectionne une trace.</p></div>
    </div>
  </main>
  <script>
    let traces = [];
    let currentTrace = null;
    const listEl = document.getElementById('list');
    const detailEl = document.getElementById('detail');
    marked.setOptions({ breaks: true, gfm: true });
    const cy = cytoscape({
      container: document.getElementById('cy'),
      elements: [],
      style: [
        { selector: 'node', style: {
            'background-color': '#6366f1',
            'background-opacity': 0.95,
            'label': 'data(label)',
            'color': '#e5e7eb',
            'text-valign': 'center',
            'text-halign': 'center',
            'font-size': '11px',
            'font-weight': '600',
            'shape': 'round-rectangle',
            'width': 'label',
            'height': 'label',
            'padding': '10px',
            'border-width': 2,
            'border-color': '#818cf8',
            'text-wrap': 'wrap',
            'text-max-width': '120px',
            'shadow-blur': 12,
            'shadow-color': '#6366f1',
            'shadow-opacity': 0.5,
        }},
        { selector: 'node.thought', style: { 'background-color': '#3b82f6', 'border-color': '#60a5fa', 'shadow-color': '#3b82f6' } },
        { selector: 'node.action', style: { 'background-color': '#10b981', 'border-color': '#34d399', 'shadow-color': '#10b981' } },
        { selector: 'node.observation', style: { 'background-color': '#f59e0b', 'border-color': '#fbbf24', 'shadow-color': '#f59e0b' } },
        { selector: 'node.error', style: { 'background-color': '#ef4444', 'border-color': '#f87171', 'shadow-color': '#ef4444' } },
        { selector: 'node:selected', style: { 'border-width': 3, 'border-color': '#22d3ee', 'shadow-color': '#22d3ee' } },
        { selector: 'edge', style: {
            'width': 2.5,
            'line-color': '#475569',
            'target-arrow-color': '#818cf8',
            'target-arrow-shape': 'triangle',
            'curve-style': 'bezier',
            'line-style': 'dashed',
            'line-dash-pattern': [6, 4],
        }},
      ],
      layout: { name: 'breadthfirst', directed: true, padding: 20, spacingFactor: 1.2 }
    });

    const chartSteps = new Chart(document.getElementById('chartSteps'), {
      type: 'bar',
      data: { labels: [], datasets: [{ label: 'steps', data: [], backgroundColor: '#6366f1', borderRadius: 6 }] },
      options: { plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true, ticks:{color:'#94a3b8'}, grid:{color:'rgba(148,163,184,.1)'}}, x:{ticks:{color:'#94a3b8', font:{size:9}}, grid:{display:false}} } }
    });
    const chartStatus = new Chart(document.getElementById('chartStatus'), {
      type: 'doughnut',
      data: { labels: ['completed','active','error'], datasets: [{ data: [0,0,0], backgroundColor: ['#10b981','#6366f1','#ef4444'], borderWidth:0 }] },
      options: { plugins:{legend:{position:'bottom', labels:{color:'#94a3b8', font:{size:10}}}}, cutout:'65%' }
    });

    function base() { return (document.getElementById('baseUrl').value || window.location.origin).replace(/\/$/, ''); }
    function headers() { const h = {}; const k = document.getElementById('apiKey').value; if (k) h['X-API-Key'] = k; return h; }
    function escape(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    async function loadTraces() {
      listEl.innerHTML = 'Chargement...';
      try {
        const res = await fetch(base() + '/api/traces', { headers: headers() });
        if (!res.ok) throw new Error(res.status + ' ' + await res.text());
        traces = await res.json();
        renderList();
        updateCharts();
      } catch (e) { listEl.innerHTML = '<p>Erreur: ' + e.message + '</p>'; }
    }
    function renderList() {
      const q = document.getElementById('search').value.toLowerCase();
      const st = document.getElementById('statusFilter').value;
      listEl.innerHTML = '';
      traces.filter(t => (!q || t.session_name.toLowerCase().includes(q)) && (!st || t.status === st))
        .forEach(t => {
          const div = document.createElement('div');
          div.className = 'trace' + (currentTrace && currentTrace.id === t.id ? ' active' : '');
          div.innerHTML = `<strong>${escape(t.session_name)}</strong><br><small>${t.id.slice(0,8)}…</small><br><small>${t.status} · ${t.step_count} steps</small>`;
          div.onclick = () => loadDetail(t.id, div);
          listEl.appendChild(div);
        });
      if (!listEl.children.length) listEl.innerHTML = '<p>Aucune trace.</p>';
      document.getElementById('stTraces').textContent = traces.length;
      document.getElementById('stSteps').textContent = traces.reduce((a,t)=>a+t.step_count,0);
    }
    async function loadDetail(id, el) {
      document.querySelectorAll('.trace').forEach(x => x.classList.remove('active'));
      if (el) el.classList.add('active');
      detailEl.innerHTML = 'Chargement...';
      try {
        const res = await fetch(base() + '/api/traces/' + id, { headers: headers() });
        if (!res.ok) throw new Error(res.status + ' ' + await res.text());
        currentTrace = await res.json();
        renderGraph(currentTrace);
        renderDetail(currentTrace);
      } catch (e) { detailEl.innerHTML = '<p>Erreur: ' + e.message + '</p>'; }
    }
    function nodeClass(s) {
      if (s.observation && /error/i.test(s.observation)) return 'error';
      if (s.action && !s.thought && s.observation) return 'observation';
      if (s.action) return 'action';
      if (s.thought) return 'thought';
      return '';
    }
    function renderGraph(t) {
      const els = [];
      (t.steps || []).forEach((s, i) => {
        const label = (s.action || s.thought || 'step ' + i).toString().slice(0, 26);
        els.push({ data: { id: 'n' + i, label, cls: nodeClass(s) }, classes: nodeClass(s) });
        if (i > 0) els.push({ data: { source: 'n' + (i-1), target: 'n' + i } });
      });
      cy.elements().remove();
      cy.add(els);
      cy.layout({ name: 'breadthfirst', directed: true, padding: 24, spacingFactor: 1.3 }).run();
      cy.off('tap', 'node');
      cy.on('tap', 'node', evt => {
        const idx = parseInt(evt.target.id().slice(1));
        const s = t.steps[idx];
        showStep(s, idx);
      });
    }
    function renderDetail(t) {
      let html = `<h3>${escape(t.session_name)}</h3><p><small>${t.id}</small> · ${t.status}</p>`;
      (t.steps || []).forEach((s, i) => { html += stepHtml(s, i); });
      detailEl.innerHTML = html;
    }
    function showStep(s, i) {
      detailEl.innerHTML = `<h3>Step ${i}</h3>` + stepHtml(s, i);
    }
    function stepHtml(s, i) {
      return `<div class="step"><div class="label">Step ${i} · ${escape(s.action||'')}</div>
        ${s.thought ? `<div class="label">Thought</div><pre>${escape(s.thought)}</pre>` : ''}
        ${s.action ? `<div class="label">Action</div><pre>${escape(s.action)}</pre>` : ''}
        ${s.observation ? `<div class="label">Observation</div><div class="md">${DOMPurify.sanitize(marked.parse(s.observation))}</div>` : ''}
        ${Object.keys(s.state_snapshot||{}).length ? `<div class="label">State</div><pre>${escape(JSON.stringify(s.state_snapshot,null,2))}</pre>` : ''}
        ${(s.prompt_tokens||s.completion_tokens||s.cost_usd) ? `<div class="label">Usage</div><pre>${s.prompt_tokens||0} prompt + ${s.completion_tokens||0} completion tokens${s.model?' · '+escape(s.model):''}${s.cost_usd? ' · $'+Number(s.cost_usd).toFixed(4):''}</pre>` : ''}
      </div>`;
    }
    function updateCharts() {
      chartSteps.data.labels = traces.map(t => t.session_name.slice(0,12));
      chartSteps.data.datasets[0].data = traces.map(t => t.step_count);
      chartSteps.update();
      const counts = {completed:0, active:0, error:0};
      traces.forEach(t => { if (counts[t.status] !== undefined) counts[t.status]++; });
      chartStatus.data.datasets[0].data = [counts.completed, counts.active, counts.error];
      chartStatus.update();
    }
    function toggleTheme() { document.body.classList.toggle('light'); }
    function exportJson() {
      if (!currentTrace) { alert('Aucune trace sélectionnée'); return; }
      const blob = new Blob([JSON.stringify(currentTrace, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = currentTrace.id + '.json'; a.click();
      URL.revokeObjectURL(url);
    }
    // Live updates via WebSocket
    try {
      const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(wsProto + '//' + location.host + '/ws');
      ws.onmessage = (ev) => { try { loadTraces(); } catch(e){} };
    } catch(e) {}
    document.getElementById('baseUrl').value = window.location.origin;
  </script>
</body>
</html>
